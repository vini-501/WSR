openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Ellipsonic OpsHub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: dashboard
    description: Dashboard operations
  - name: departments
    description: Department operations
  - name: employees
    description: Employee operations
  - name: reports
    description: Weekly report operations
  - name: notifications
    description: Notification operations
  - name: activity-logs
    description: Activity log operations
  - name: audit-logs
    description: Audit log operations
  - name: analytics
    description: Analytics operations
  - name: management
    description: Management dashboard operations
  - name: settings
    description: Settings operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ───── AUTH ─────
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /auth/profile:
    put:
      operationId: updateProfile
      tags: [auth]
      summary: Update current user profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ───── DASHBOARD ─────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-activity:
    get:
      operationId: getDashboardRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/upcoming-deadlines:
    get:
      operationId: getDashboardUpcomingDeadlines
      tags: [dashboard]
      summary: Get upcoming report deadlines
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Upcoming deadlines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeadlineItem"

  /dashboard/chart-data:
    get:
      operationId: getDashboardChartData
      tags: [dashboard]
      summary: Get chart data for dashboard
      security: [{ bearerAuth: [] }]
      parameters:
        - name: weeks
          in: query
          schema:
            type: integer
            default: 8
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardChartData"

  # ───── DEPARTMENTS ─────
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List departments
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated departments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentPage"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    get:
      operationId: getDepartment
      tags: [departments]
      summary: Get a department
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
    put:
      operationId: updateDepartment
      tags: [departments]
      summary: Update a department
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Soft delete a department
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ───── EMPLOYEES ─────
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: department_id
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, department_head, employee, management]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, on_leave, resigned]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, employee_id, role, status, joining_date, department_name]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated employees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePage"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/import:
    post:
      operationId: importEmployees
      tags: [employees]
      summary: Bulk import employees from CSV
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                csvData:
                  type: string
              required: [csvData]
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  message:
                    type: string
                required: [success, count, message]

  /employees/export:
    get:
      operationId: exportEmployees
      tags: [employees]
      summary: Bulk export employees to CSV
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Exported CSV file
          content:
            text/csv:
              schema:
                type: string

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    put:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Soft delete an employee
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: permanent
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ───── WEEKLY REPORTS ─────
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List weekly reports
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: department_id
          in: query
          schema:
            type: string
        - name: employee_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, under_review, approved, rejected, needs_changes]
        - name: week_start
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPage"
    post:
      operationId: createReport
      tags: [reports]
      summary: Create a weekly report (draft)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a weekly report
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
    put:
      operationId: updateReport
      tags: [reports]
      summary: Update a weekly report
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportUpdate"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete a draft report
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /reports/{id}/submit:
    post:
      operationId: submitReport
      tags: [reports]
      summary: Submit a report for review
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submitted report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}/under-review:
    post:
      operationId: reviewReport
      tags: [reports]
      summary: Mark a submitted report as under review
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report status updated to under review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}/approve:
    post:
      operationId: approveReport
      tags: [reports]
      summary: Approve a submitted report
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalAction"
      responses:
        "200":
          description: Approved report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}/reject:
    post:
      operationId: rejectReport
      tags: [reports]
      summary: Reject a submitted report
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalAction"
      responses:
        "200":
          description: Rejected report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}/request-changes:
    post:
      operationId: requestReportChanges
      tags: [reports]
      summary: Request changes on a submitted report
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalAction"
      responses:
        "200":
          description: Report with changes requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ───── NOTIFICATIONS ─────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: unread_only
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: Get unread notification count
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /notifications/read-all:
    put:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /notifications/{id}/read:
    put:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  # ───── ACTIVITY LOGS ─────
  /activity-logs:
    get:
      operationId: listActivityLogs
      tags: [activity-logs]
      summary: List activity logs
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated activity logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLogPage"

  # ───── AUDIT LOGS ─────
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit-logs]
      summary: List audit logs
      security: [{ bearerAuth: [] }]
      parameters:
        - name: table_name
          in: query
          schema:
            type: string
        - name: operation
          in: query
          schema:
            type: string
            enum: [INSERT, UPDATE, DELETE]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"

  # ───── ANALYTICS ─────
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Get analytics overview
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /analytics/weekly-trends:
    get:
      operationId: getWeeklyTrends
      tags: [analytics]
      summary: Get weekly report submission trends
      security: [{ bearerAuth: [] }]
      parameters:
        - name: weeks
          in: query
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Weekly trends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendDataPoint"

  /analytics/monthly-trends:
    get:
      operationId: getMonthlyTrends
      tags: [analytics]
      summary: Get monthly report submission trends
      security: [{ bearerAuth: [] }]
      parameters:
        - name: months
          in: query
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Monthly trends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendDataPoint"

  /analytics/department-comparison:
    get:
      operationId: getDepartmentComparison
      tags: [analytics]
      summary: Get department-level submission comparison
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Department comparison
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentComparisonItem"

  /analytics/employee-activity:
    get:
      operationId: getEmployeeActivity
      tags: [analytics]
      summary: Get employee activity stats
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Employee activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeActivityItem"

  # ───── MANAGEMENT ─────
  /management/summary:
    get:
      operationId: getManagementSummary
      tags: [management]
      summary: Get management executive summary
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Management summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementSummary"

  /management/department-completion:
    get:
      operationId: getManagementDepartmentCompletion
      tags: [management]
      summary: Get department completion rates for management
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Department completion
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentCompletionItem"

  /management/top-contributors:
    get:
      operationId: getTopContributors
      tags: [management]
      summary: Get top contributing employees
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Top contributors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopContributorItem"

  /management/pending-reviews:
    get:
      operationId: getManagementPendingReviews
      tags: [management]
      summary: Get reports pending review
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Pending reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPage"

  # ───── SETTINGS ─────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get company settings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Company settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update company settings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    # ── Auth / User ──
    UserProfile:
      type: object
      properties:
        id:
          type: string
        auth_user_id:
          type: string
        employee_id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        photo_url:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, department_head, employee, management]
        department_id:
          type: ["string", "null"]
        department_name:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive, on_leave, resigned]
        joining_date:
          type: ["string", "null"]
        designation:
          type: ["string", "null"]
        employment_type:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
        work_location:
          type: ["string", "null"]
        weekly_reporting_frequency:
          type: ["integer", "null"]
        created_at:
          type: string
